[telegram]
token = "123456:replace-me"
allowed_users = [123456789]

[storage]
# Relative paths are resolved from this file.
directory = "./data"

[opencode]
# Linux example. On Windows, use a TOML literal string such as
# auth_file = 'C:\path\to\opencode\auth.json'
auth_file = "/home/user/.local/share/opencode/auth.json"

[codex]
# A command in PATH or an absolute path to the Codex executable.
binary = "codex"
# Optional. Enables the Codex workspace and switches the live Codex CLI login.
# Codex must use file-based credential storage for this file.
# auth_file = "~/.codex/auth.json"

[service]
scheduler_interval_seconds = 60

# Uncomment the sections below only for multihost routing.
# [sync]
# interval_seconds = 120
# connect_timeout_seconds = 5
# command_timeout_seconds = 15
#
# [[hosts]]
# name = "local"
# Local endpoints are derived from [opencode] and [codex].
