[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openswap"
version = "2.2.0"
description = "A small Telegram control plane for ChatGPT Sessions in OpenCode"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["opencode", "codex", "chatgpt", "oauth", "telegram"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Utilities",
]
dependencies = ["portalocker>=3.2,<4"]

[project.urls]
Homepage = "https://github.com/Krablante/openswap"
Repository = "https://github.com/Krablante/openswap"
Issues = "https://github.com/Krablante/openswap/issues"

[project.scripts]
openswap = "openswap.app:main"

[tool.setuptools]
packages = ["openswap"]
